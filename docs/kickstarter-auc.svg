<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d">
  <title id="t">Kickstarter: AUC by number of labeled rows</title>
  <desc id="d">tab-jev (jev then tab) reaches AUC 0.684, 0.745 and 0.765 with 64, 256 and 1,024 labels. A tabular foundation model on the table alone reaches 0.641, 0.688, 0.696. Jev reading the text, recalibrated, stays at 0.682. TF-IDF plus the table in logistic regression reaches 0.623, 0.649, 0.662.</desc>
  <style>
    text { font-family: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0b0b0b; }
    .muted { fill: #52514e; }
    .faint { fill: #8a8984; }
    .grid { stroke: #e7e6e2; stroke-width: 1; }
    .axis { stroke: #c9c8c2; stroke-width: 1; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .err { stroke-width: 1.5; stroke-linecap: round; }
  </style>
  <rect width="760" height="420" rx="14" fill="#fcfcfb"/>

  <text x="28" y="38" font-size="17" font-weight="650">Kickstarter: AUC by number of labeled rows</text>
  <text x="28" y="60" font-size="12.5" class="muted">2,002 test projects (32% funded). Jev API + TabPFN 3.5. Mean over label draws; bars show ± 1 std.</text>

  <!-- grid and y axis: AUC 0.60 to 0.78 maps to y 330 to 50 -->
  <g font-size="11.5" class="muted" text-anchor="end">
    <line class="grid" x1="70" y1="330" x2="540" y2="330"/><text x="60" y="334">0.60</text>
    <line class="grid" x1="70" y1="252.2" x2="540" y2="252.2"/><text x="60" y="256.2">0.65</text>
    <line class="grid" x1="70" y1="174.4" x2="540" y2="174.4"/><text x="60" y="178.4">0.70</text>
    <line class="grid" x1="70" y1="96.7" x2="540" y2="96.7"/><text x="60" y="100.7">0.75</text>
  </g>
  <line class="axis" x1="70" y1="330" x2="540" y2="330"/>
  <text x="22" y="190" font-size="11.5" class="muted" transform="rotate(-90 22 190)" text-anchor="middle">AUC</text>

  <!-- x axis: labeled rows, log scale -->
  <g font-size="11.5" class="muted" text-anchor="middle">
    <line class="axis" x1="110" y1="330" x2="110" y2="335"/><text x="110" y="351">64</text>
    <line class="axis" x1="315" y1="330" x2="315" y2="335"/><text x="315" y="351">256</text>
    <line class="axis" x1="520" y1="330" x2="520" y2="335"/><text x="520" y="351">1,024</text>
    <text x="315" y="375">labeled rows (log scale)</text>
  </g>

  <!-- TF-IDF + table, logistic regression (slot 4, yellow) -->
  <g stroke="#eda100">
    <path class="err" d="M110 280.2 V308.2 M315 242.9 V264.7 M520 222.7 V244.5"/>
    <polyline class="line" points="110,294.2 315,253.8 520,233.6"/>
  </g>
  <g fill="#eda100" stroke="#fcfcfb" stroke-width="2">
    <circle cx="110" cy="294.2" r="5"/><circle cx="315" cy="253.8" r="5"/><circle cx="520" cy="233.6" r="5"/>
  </g>

  <!-- jev reads the text, recalibrated with Platt (slot 3, aqua) -->
  <g stroke="#1baf7a">
    <polyline class="line" points="110,202.4 315,202.4 520,202.4" stroke-dasharray="1 0"/>
  </g>
  <g fill="#1baf7a" stroke="#fcfcfb" stroke-width="2">
    <circle cx="110" cy="202.4" r="5"/><circle cx="315" cy="202.4" r="5"/><circle cx="520" cy="202.4" r="5"/>
  </g>

  <!-- TFM on the table only (slot 2, orange) -->
  <g stroke="#eb6834">
    <path class="err" d="M110 264.6 V267.8 M315 188.4 V197.8 M520 176 V185.4"/>
    <polyline class="line" points="110,266.2 315,193.1 520,180.7"/>
  </g>
  <g fill="#eb6834" stroke="#fcfcfb" stroke-width="2">
    <circle cx="110" cy="266.2" r="5"/><circle cx="315" cy="193.1" r="5"/><circle cx="520" cy="180.7" r="5"/>
  </g>

  <!-- tab-jev: jev -> tab (slot 1, blue) -->
  <g stroke="#2a78d6">
    <path class="err" d="M110 190 V208.6 M315 98.2 V110.6"/>
    <polyline class="line" points="110,199.3 315,104.4 520,73.3" stroke-width="2.5"/>
  </g>
  <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="2">
    <circle cx="110" cy="199.3" r="5.5"/><circle cx="315" cy="104.4" r="5.5"/>
  </g>
  <!-- one label draw so far at 1,024: hollow marker -->
  <circle cx="520" cy="73.3" r="5" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2.5"/>

  <!-- direct labels at the line ends -->
  <g font-size="12.5">
    <text x="536" y="77.3"><tspan font-weight="650">tab-jev</tspan> (jev → tab)</text>
    <text x="536" y="93.3" class="muted" font-size="11.5">0.765, one draw so far</text>
    <text x="536" y="178.7">TFM, table only</text>
    <text x="536" y="193.7" class="muted" font-size="11.5">0.696</text>
    <text x="536" y="210.4">jev text + calibration</text>
    <text x="536" y="225.4" class="muted" font-size="11.5">0.682, flat</text>
    <text x="536" y="248.6">TF-IDF + table, LR</text>
    <text x="536" y="263.6" class="muted" font-size="11.5">0.662</text>
  </g>

  <text x="28" y="404" font-size="11" class="faint">Source: demo/results/kickstarter_cloud_tabpfn.md. Test rows split by near-duplicate groups.</text>
</svg>
