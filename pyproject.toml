[project]
name = "tab-jev"
version = "0.1.0.dev0"
description = "Pluggable framework for predictions on mixed text and tabular data (early development)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "jxucoder" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
# Recommended: Jev API + TabPFN API.
tabpfn = ["tabpfn-client>=0.6.0"]
# Included for local use: TabICL (Kev runs as its own server).
local = ["tabicl>=2.2.0"]
tabicl = ["tabicl>=2.2.0"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
demo = [
    "tabicl>=2.2.0",
    "tabpfn-client>=0.6.0",
    "tabulate>=0.10.0",
]
dev = [
    "pytest>=9.1.1",
    "scikit-learn>=1.7.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
